version: '3.8'

services:
  api:
    build: .
    container_name: otsi-attendance-api
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "True"
      FLASK_APP: app.py
      JWT_SECRET_KEY: your-super-secret-key-change-this
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5000,http://127.0.0.1:5000"
      SERVER_PORT: 5000
      SERVER_HOST: 0.0.0.0
    volumes:
      - .:/app
    networks:
      - otsi-network
    restart: unless-stopped

networks:
  otsi-network:
    driver: bridge
